name: Examples CI

# Single matrix with per-example `host:` field — no parallel matrix
# blocks. Adding an example: drop a new dir under examples/<name>/
# with package.json having `npm test` defined, then add a row below.
#
# Host targets:
#   - v2-reference — CI starts the v2 reference host first (port 3838).
#   - external   — CI runs only when OPENWOP_EXTERNAL_BASE_URL and
#                  OPENWOP_EXTERNAL_API_KEY secrets are set.
#                  Otherwise the example exits 0 with a skip-equivalent message.
#   - dry-run    — example needs no host; runs unconditionally.
#
# External-host examples MUST use Idempotency-Key in their HTTP
# requests so CI re-runs collapse to a single run server-side
# and MUST exit 0 with a clear skip-equivalent message when their target
# env vars are unset.

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
      - 'scripts/check-example-pack-refs.mjs'
  # PRs trigger WITHOUT a workflow-level path filter so the required `gate`
  # job always reports a check (a path-filtered workflow that never runs leaves
  # a required check "expected" forever and deadlocks the merge). Relevance is
  # instead computed per-job in `changes`, so the heavy matrix still stays lean
  # on PRs that don't touch examples.
  pull_request:
    branches: [main]

# Every job only checks out the repo and runs npm/node; none writes to the
# repo, issues, PRs or packages, so the token is read-only throughout.
permissions:
  contents: read

jobs:
  # Detect whether this PR touches example-relevant paths. The real jobs gate on
  # this so a docs/registry-only PR skips the matrix, while the always-run `gate`
  # job below still reports a (passing) required check.
  changes:
    name: Detect example-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            # Non-PR (push) events keep the workflow-level path filter, so a run
            # here is already example-relevant.
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
               | grep -qE '^(examples/|\.github/workflows/examples\.yml$|scripts/check-example-pack-refs\.mjs$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  validate-workflow-defs:
    name: Validate workflow-definition pack references
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Workflow-definition examples (market-intel-pipeline, ads-publish-pipeline,
    # rag-grounded-chat) declare their pack dependencies in metadata.packs[].
    # This gate catches drift if a referenced pack is yanked or its version is
    # no longer published. Resolves against the live registry at packs.openwop.dev
    # (the registry catalog lives in the openwop-registry repo; spec-prose pack
    # claims are checked separately in the openwop spec repo).
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate metadata.packs[] references resolve
        run: node scripts/check-example-pack-refs.mjs --registry https://packs.openwop.dev

  examples:
    name: examples (${{ matrix.example.name }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          # v2-targeting — CI starts the v2 reference host (port 3838). A sample
          # whose surface the host does not advertise exits 0 saying so.
          - { name: tiny-workflow,           host: v2-reference }
          - { name: streaming-client,        host: v2-reference }
          - { name: idempotent-runs,         host: v2-reference }
          - { name: approval-workflow,       host: v2-reference }
          - { name: branch-fork,             host: v2-reference }
          - { name: branching-workflow,      host: v2-reference }
          - { name: mcp-tool,                host: v2-reference }
          - { name: multi-agent-cross-host,  host: v2-reference }
          # Dry-run — no host needed (core-packs-lockfile reads packs.openwop.dev).
          - { name: node-pack-publishing,    host: dry-run }
          - { name: core-packs-lockfile,     host: dry-run }
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Detect whether external-host secrets are available. External-host
      # examples skip cleanly when the operator hasn't configured the
      # OPENWOP_EXTERNAL_* secrets (e.g., forks, public branches).
      - name: Resolve external-host availability
        id: external
        env:
          EXT_URL: ${{ secrets.OPENWOP_EXTERNAL_BASE_URL }}
        run: |
          if [ "${{ matrix.example.host }}" = "external" ] && [ -z "$EXT_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.example.name }} — OPENWOP_EXTERNAL_BASE_URL not configured."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # v2 reference host setup — only when host == v2-reference
      - name: Install v2 reference host
        if: matrix.example.host == 'v2-reference'
        working-directory: examples/hosts/v2-reference
        run: npm install --legacy-peer-deps

      - name: Start v2 reference host
        if: matrix.example.host == 'v2-reference'
        working-directory: examples/hosts/v2-reference
        env:
          OPENWOP_PORT: '3838'
        run: |
          npm start > /tmp/openwop-host.log 2>&1 &
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:3838/.well-known/openwop > /dev/null; then
              echo "host ready"; exit 0
            fi
            sleep 1
          done
          echo "host failed to start" >&2
          cat /tmp/openwop-host.log >&2
          exit 1

      # Common: install + run the example.
      - name: Install example deps
        if: steps.external.outputs.skip != 'true'
        working-directory: examples/${{ matrix.example.name }}
        run: npm install --silent

      - name: Run example
        if: steps.external.outputs.skip != 'true'
        working-directory: examples/${{ matrix.example.name }}
        env:
          # Three host modes:
          #   - v2-reference: target the local v2 reference host started above (localhost:3838)
          #   - external:  use the operator-provided secrets; when secrets are unset,
          #                leave empty so the example's `if (!BASE_URL) skip()` branch fires
          #   - dry-run:   no env vars needed (the example ignores them)
          # The previous expression collapsed `external + missing secrets` to localhost,
          # which defeated each example's skip-equivalent contract; now external-with-
          # empty-secret falls through to '' and the example exits 0 cleanly.
          OPENWOP_BASE_URL: ${{ matrix.example.host == 'v2-reference' && 'http://127.0.0.1:3838' || (matrix.example.host == 'external' && secrets.OPENWOP_EXTERNAL_BASE_URL) || '' }}
          OPENWOP_API_KEY: ${{ matrix.example.host == 'v2-reference' && 'openwop-v2-dev-key' || (matrix.example.host == 'external' && secrets.OPENWOP_EXTERNAL_API_KEY) || '' }}
        run: npm test
        timeout-minutes: 2

      - name: Show host log on failure
        if: failure() && matrix.example.host == 'v2-reference'
        run: cat /tmp/openwop-host.log

  # The SQLite v2 host's own checks: typecheck (which also checks the
  # v2-reference contract modules it imports) and the durability test, which
  # SIGKILLs a host process mid-run and resumes the run from the file.
  host-sqlite:
    name: host (sqlite)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install
        working-directory: examples/hosts/sqlite
        run: npm install --legacy-peer-deps
      - name: Typecheck
        working-directory: examples/hosts/sqlite
        run: npm run typecheck
      - name: Test
        working-directory: examples/hosts/sqlite
        run: npm test
        timeout-minutes: 3

  # The Postgres v2 host's own checks. A Postgres service lets the durability
  # test run its multi-process cases (two host processes on one database, one
  # SIGKILLed mid-run, the other takes the run over through the released
  # advisory lock); without OPENWOP_PG_DSN those cases skip and the rest run on
  # PGlite. The audit export and pack-consumer tests read files from the spec
  # and registry repos, so those are sparse-checked-out beside this one.
  host-postgres:
    name: host (postgres)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: openwop
          POSTGRES_DB: openwop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - name: Check out the out-of-band audit verifier (openwop)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop
          path: ext/openwop
          sparse-checkout: scripts/verify-audit-checkpoints.mjs
          sparse-checkout-cone-mode: false
      - name: Check out the signed example pack (openwop-registry)
        uses: actions/checkout@v6
        with:
          repository: openwop/openwop-registry
          path: ext/openwop-registry
          sparse-checkout: |
            registry/keys
            registry/v1/packs/core.openwop.examples
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install
        working-directory: examples/hosts/postgres
        run: npm install --legacy-peer-deps
      - name: Typecheck
        working-directory: examples/hosts/postgres
        run: npm run typecheck
      - name: Test
        working-directory: examples/hosts/postgres
        env:
          OPENWOP_PG_DSN: postgres://postgres:openwop@127.0.0.1:5432/openwop
        run: npm test
        timeout-minutes: 4
      - name: Test (audit export, pack consumer)
        working-directory: examples/hosts/postgres
        env:
          OPENWOP_SPEC_REPO: ${{ github.workspace }}/ext/openwop
          OPENWOP_REGISTRY_REPO: ${{ github.workspace }}/ext/openwop-registry
        run: npm run test:siblings
        timeout-minutes: 2

  # The Python v2 host's own checks: stdlib only, so no install step. The
  # contract test compares its copied error rows and event types with the
  # corpus, so fetch @openwop/spec-artifacts first; the durability test
  # SIGKILLs a host process mid-run and resumes the run from the file.
  host-python:
    name: host (python)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Fetch the v2 corpus (spec-artifacts)
        run: |
          mkdir -p /tmp/spec-artifacts && cd /tmp/spec-artifacts
          npm pack --silent @openwop/spec-artifacts@2.49.14
          tar -xzf openwop-spec-artifacts-2.49.14.tgz
      - name: Compile
        working-directory: examples/hosts/python
        run: python -m compileall -q src tests
      - name: Test
        working-directory: examples/hosts/python
        env:
          OPENWOP_SPEC_ARTIFACTS_DIR: /tmp/spec-artifacts/package
        run: python -m unittest discover -s tests -v
        timeout-minutes: 3

  # Single, always-run required check. Aggregates the (possibly-skipped) real
  # jobs so branch protection has one stable context to require with
  # `strict: true` — a docs-only PR skips the matrix and this still passes; an
  # example-touching PR fails the gate iff a real job failed. Requiring this
  # (not the 7 matrix legs) also keeps the required-check list stable when
  # examples are added or removed.
  gate:
    name: Examples gate
    needs: [changes, validate-workflow-defs, examples, host-sqlite, host-postgres, host-python]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          VALIDATE_RESULT: ${{ needs.validate-workflow-defs.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
          HOST_SQLITE_RESULT: ${{ needs.host-sqlite.result }}
          HOST_POSTGRES_RESULT: ${{ needs.host-postgres.result }}
          HOST_PYTHON_RESULT: ${{ needs.host-python.result }}
        run: |
          echo "validate-workflow-defs=$VALIDATE_RESULT  examples=$EXAMPLES_RESULT  host-sqlite=$HOST_SQLITE_RESULT  host-postgres=$HOST_POSTGRES_RESULT  host-python=$HOST_PYTHON_RESULT"
          # 'success' and 'skipped' are OK; 'failure'/'cancelled' fail the gate.
          for r in "$VALIDATE_RESULT" "$EXAMPLES_RESULT" "$HOST_SQLITE_RESULT" "$HOST_POSTGRES_RESULT" "$HOST_PYTHON_RESULT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required examples job did not succeed ($r)."
              exit 1
            fi
          done
          echo "Examples gate OK."
