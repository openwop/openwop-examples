name: Host v2-reference

# The charter §F witness host: typecheck, the route-level harness, and the
# 2.0.0 suite at --target-major 2. The two 2.0.0-rc peers are exact-pinned;
# until both are on npm the job records a notice and exits 0 instead of
# installing a version the registry does not serve.

on:
  push:
    branches: [main]
    paths:
      - 'examples/hosts/v2-reference/**'
      - '.github/workflows/host-v2-reference.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/hosts/v2-reference/**'
      - '.github/workflows/host-v2-reference.yml'

jobs:
  v2-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/hosts/v2-reference
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Resolve the 2.0.0-rc peers
        id: peers
        run: |
          SUITE=$(node -p "require('./package.json').devDependencies['@openwop/openwop-conformance']")
          if npm view "@openwop/openwop-conformance@${SUITE}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@openwop/openwop-conformance@${SUITE} is not on npm yet — skipping the v2-reference job (install it from the release tarballs locally)."
          fi
      - name: Install
        if: steps.peers.outputs.published == 'true'
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps
      - name: Typecheck
        if: steps.peers.outputs.published == 'true'
        run: npm run typecheck
      - name: Route-level harness
        if: steps.peers.outputs.published == 'true'
        run: npm test
      - name: Start the host
        if: steps.peers.outputs.published == 'true'
        env:
          # The suite's fixtures are loopback listeners, so CI runs this host with
          # its egress guard OPEN. That is a relaxation, and until 2026-09-21 this
          # job ran under it while declaring nothing - the same defect
          # scripts/cut-bundle.sh had (openwop docs/KNOWN-LIMITS.md). It is now
          # DECLARED in BOTH Conformance steps below. CI is a REGRESSION LANE: it
          # says the host still behaves, never that it certifies. The certifying
          # cut is scripts/cut-public.sh, guard closed, run by an operator.
          OPENWOP_WEBHOOK_ALLOW_PRIVATE: 'true'
          # RFC 0199 (suite >= 2.36.0): the suite's OAuth authorization-server doubles
          # listen on loopback, and the host's token request goes through its own egress
          # guard (src/oauth.ts tokenRequest), which refuses them unless this is set. The
          # certifying cut fronts them over https instead and leaves this guard CLOSED
          # (cut-public.sh). Unset, the first 2.40.0 run failed 5 RFC 0199 positive controls
          # with "the token endpoint refused the exchange" (openwop-examples#89).
          OPENWOP_OAUTH_ALLOW_PRIVATE: 'true'
        run: |
          npm start > /tmp/v2-reference.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:3838/.well-known/openwop >/dev/null && exit 0; sleep 1; done
          cat /tmp/v2-reference.log; exit 1
      - name: Conformance (target major 2)
        if: steps.peers.outputs.published == 'true'
        env:
          # Measure the SAME host the published bundle describes. Before this,
          # CI invoked the suite bare while scripts/cut-bundle.sh supplied a
          # whole env block, so the two disagreed about what this host even
          # offers — and CI has been red on main since 2026-09-18 07:46, when
          # suite 2.4.5 first made --require-behavior do anything.
          #
          # The three opt-outs are the ones cut-bundle.sh declares: strict mode
          # requires every capability-gated scenario to find its family
          # ADVERTISED or find an explicit opt-out, and this host implements
          # none of the three. An opt-out is a CLAIM, not a hiding place — it is
          # recorded in the bundle where a reader can see it.
          #
          # The fakes are in-process and match the cut. The SAML/SCIM seam
          # opt-ins are deliberately NOT set: they need the synthetic IdP that
          # only cut-bundle.sh starts, and those rows skip honestly without it.
          OPENWOP_OPTED_OUT_PROFILES: 'family.forms,family.memory,connections.packsSupported'
          # The relaxation this leg's host runs under, declared. Suite >= 2.33.0
          # checks: `v2-webhook-egress-refusal` registers eight destinations the
          # guard MUST refuse, and with the guard open and NOTHING declared it
          # fails (it did, on this job's first run on 2.33.1). Declared, the row
          # records `inapplicable` and the profile built on `webhooks` honestly
          # does not certify.
          OPENWOP_HOST_RELAXATIONS: '[{"obligation":"webhooks.egress-guard","durability":"session","reason":"CI regression lane: OPENWOP_WEBHOOK_ALLOW_PRIVATE opens this host egress guard because every suite fixture is a loopback listener"}]'
          OPENWOP_A2A_FAKE_PEER: 'true'
          OPENWOP_A2A_FAKE_PEER_VERSIONS: '1.0,0.3'
          OPENWOP_MCP_FAKE_SERVER: 'true'
        run: npx openwop-conformance --base-url http://127.0.0.1:3838 --api-key openwop-v2-dev-key --target-major 2 --require-behavior --max-workers 4
      # ── The retirement lane ────────────────────────────────────────────
      #
      # Every host passes through the v1-retired state exactly once, at the end
      # of the overlap, and until 2026-09-13 no host had ever been MEASURED in
      # it except one tier-2 throwaway service. That single rehearsal found a
      # suite defect a dual-stack host cannot surface —
      # `v2-version-header-honored` failed a CONFORMANT single-major host,
      # fixed in suite 2.1.2 — and produced the first real answer to what going
      # v2-only costs. Without a continuous instrument, the first host through
      # the door in December is the one that discovers whatever else is there.
      #
      # This leg is that instrument. It boots the SAME host with one flag and
      # runs the SAME major-2 suite, so a difference between the two legs is a
      # difference retirement makes and nothing else.
      #
      # It earned its place on its first run: it failed
      # `v2-compensation-read-projection`, whose unknown-run probe used a BARE
      # run id — the v1 spelling, which `identity.md` §5 requires a retired host
      # to refuse `400 validation_error`. The probe asked about shape and never
      # reached the existence check it asserted. Suite 2.1.6 fixed the probe;
      # the host was right.
      - name: Stop the overlap host
        if: steps.peers.outputs.published == 'true'
        run: pkill -f 'tsx src/server.ts' || true
      - name: Start the host with v1 RETIRED
        id: retired
        if: steps.peers.outputs.published == 'true'
        env:
          OPENWOP_V1_RETIRED: '1'
          OPENWOP_WEBHOOK_ALLOW_PRIVATE: 'true'
          # RFC 0199 (suite >= 2.36.0): the suite's OAuth authorization-server doubles
          # listen on loopback, and the host's token request goes through its own egress
          # guard (src/oauth.ts tokenRequest), which refuses them unless this is set. The
          # certifying cut fronts them over https instead and leaves this guard CLOSED
          # (cut-public.sh). Unset, the first 2.40.0 run failed 5 RFC 0199 positive controls
          # with "the token endpoint refused the exchange" (openwop-examples#89).
          OPENWOP_OAUTH_ALLOW_PRIVATE: 'true'
          OPENWOP_PORT: '3839'
          OPENWOP_DB_PATH: /tmp/v2-reference-retired.sqlite
        run: |
          npm start > /tmp/v2-reference-retired.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:3839/.well-known/openwop >/dev/null && break; sleep 1; done
          # Assert the ATOMIC SET before running a suite against it. A lane that
          # boots a host it has not checked is retired would report the overlap
          # twice and call it coverage.
          set -euo pipefail
          adv=$(curl -sf http://127.0.0.1:3839/.well-known/openwop | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s);console.log(JSON.stringify(d.protocolVersions)+" "+d.preferredVersion)})')
          test "$adv" = '["2.0"] 2.0' || { echo "::error::retired host advertises $adv, expected [\"2.0\"] 2.0"; cat /tmp/v2-reference-retired.log; exit 1; }
          v1hdr=$(curl -s -o /dev/null -w '%{http_code}' -H 'OpenWOP-Version: 1' http://127.0.0.1:3839/.well-known/openwop)
          test "$v1hdr" = '406' || { echo "::error::OpenWOP-Version: 1 answered $v1hdr, expected 406 (versioning.md §1.3 row 2)"; exit 1; }
          v1path=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer openwop-v2-dev-key' http://127.0.0.1:3839/v1/runs)
          test "$v1path" = '404' || { echo "::error::a /v1 path answered $v1path, expected 404 (the path space retires atomically, versioning.md §5)"; exit 1; }
          echo "retired host verified: protocolVersions [\"2.0\"], header 1 -> 406, /v1 -> 404"
      - name: Conformance with v1 retired (target major 2)
        if: steps.peers.outputs.published == 'true'
        env:
          # Measure the SAME host the published bundle describes. Before this,
          # CI invoked the suite bare while scripts/cut-bundle.sh supplied a
          # whole env block, so the two disagreed about what this host even
          # offers — and CI has been red on main since 2026-09-18 07:46, when
          # suite 2.4.5 first made --require-behavior do anything.
          #
          # The three opt-outs are the ones cut-bundle.sh declares: strict mode
          # requires every capability-gated scenario to find its family
          # ADVERTISED or find an explicit opt-out, and this host implements
          # none of the three. An opt-out is a CLAIM, not a hiding place — it is
          # recorded in the bundle where a reader can see it.
          #
          # The fakes are in-process and match the cut. The SAML/SCIM seam
          # opt-ins are deliberately NOT set: they need the synthetic IdP that
          # only cut-bundle.sh starts, and those rows skip honestly without it.
          OPENWOP_OPTED_OUT_PROFILES: 'family.forms,family.memory,connections.packsSupported'
          # The relaxation this leg's host runs under, declared. Suite >= 2.33.0
          # checks: `v2-webhook-egress-refusal` registers eight destinations the
          # guard MUST refuse, and with the guard open and NOTHING declared it
          # fails (it did, on this job's first run on 2.33.1). Declared, the row
          # records `inapplicable` and the profile built on `webhooks` honestly
          # does not certify.
          OPENWOP_HOST_RELAXATIONS: '[{"obligation":"webhooks.egress-guard","durability":"session","reason":"CI regression lane: OPENWOP_WEBHOOK_ALLOW_PRIVATE opens this host egress guard because every suite fixture is a loopback listener"}]'
          OPENWOP_A2A_FAKE_PEER: 'true'
          OPENWOP_A2A_FAKE_PEER_VERSIONS: '1.0,0.3'
          OPENWOP_MCP_FAKE_SERVER: 'true'
        run: npx openwop-conformance --base-url http://127.0.0.1:3839 --api-key openwop-v2-dev-key --target-major 2 --require-behavior --max-workers 4
      - name: Retired host log on failure
        if: failure()
        run: cat /tmp/v2-reference-retired.log || true

      - name: Host log on failure
        if: failure()
        run: cat /tmp/v2-reference.log || true
